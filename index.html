<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DRAGONS101</title>
</head>
<body>

    <!-- ===== Login Overlay ===== -->
    <div class="login-overlay" id="loginOverlay">
        <div class="login-box">
            <h2>👋 خوش آمدید!</h2>
            <p style="color:rgba(255,255,255,0.4);margin-bottom:15px;font-size:14px;">نام خود را وارد کنید</p>
            <input type="text" id="usernameInput" placeholder="نام شما..." />
            <button class="btn btn-primary" onclick="loginUser()">ورود</button>
        </div>
    </div>

    <div class="container">
        <!-- ===== HEADER با فرنگی دزد ===== -->
        <div class="header">
            <div class="header-left">
                <!-- فرنگی دزد (آدمک مینیمال) -->
                <div class="dragon-container" id="dragonContainer">
                    <div class="dragon" id="dragon">
                        <div class="dragon-body">
                            <div class="dragon-head">
                                <div class="dragon-hat">🎓</div>
                            </div>
                            <div class="dragon-body-line"></div>
                            <div class="dragon-arm left-arm"></div>
                            <div class="dragon-arm right-arm"></div>
                            <div class="dragon-leg left-leg"></div>
                            <div class="dragon-leg right-leg"></div>
                        </div>
                    </div>
                </div>
                <!-- عنوان -->
                <div class="title-section">
                    <h1>🐉 DRAGONS101</h1>
                    <div class="subtitle">⚡ DRAGONOLOGY ⚡</div>
                </div>
            </div>
            <div class="header-right">
                <div class="score-badge">⭐ <span id="userScore">0</span></div>
                <div class="streak-box" id="streakBox">
                    <span class="fire-icon">🔥</span>
                    <span class="streak-number" id="streakNumber">0</span>
                    <span style="font-size:14px;margin-right:2px;">روز</span>
                </div>
            </div>
        </div>

        <!-- ===== تب‌ها ===== -->
        <div class="tabs">
            <button class="tab-btn active" data-tab="admin">📝 مدیریت</button>
            <button class="tab-btn" data-tab="game">🎮 بازی</button>
            <button class="tab-btn" data-tab="study">📖 آموزش</button>
            <button class="tab-btn" data-tab="grammar">📝 گرامر</button>
            <button class="tab-btn" data-tab="rank">🏆 آمار</button>
        </div>

        <!-- ========================================================= -->
        <!-- PAGE: ADMIN (مدیریت) -->
        <!-- ========================================================= -->
        <div id="page-admin" class="page active">
            <div id="adminLock" style="display:none;">
                <div class="admin-form">
                    <input type="password" id="adminPassword" placeholder="رمز ورود به پنل مدیریت" />
                    <button class="btn btn-primary" onclick="checkAdminPassword()">ورود به پنل</button>
                </div>
            </div>
            <div id="adminPanel" style="display:none;">
                <h3 style="margin-bottom:15px;color:rgba(255,255,255,0.7);">➕ افزودن کلمه جدید</h3>
                <div class="admin-form">
                    <input type="text" id="wordEn" placeholder="کلمه به انگلیسی" />
                    <input type="text" id="wordFa" placeholder="معنی فارسی" />
                    <textarea id="wordSentence" placeholder="جمله مثال (اختیاری)"></textarea>
                    <button class="btn btn-primary" onclick="addWord()">➕ افزودن کلمه</button>
                </div>

                <h3 style="margin:20px 0 10px;color:rgba(255,255,255,0.7);">📋 لیست کلمات</h3>
                <div class="word-list" id="wordListContainer"></div>

                <hr style="margin:20px 0;border:1px solid rgba(255,255,255,0.05);" />

                <h3 style="margin-bottom:15px;color:rgba(255,255,255,0.7);">✅ تسک روزانه</h3>
                <div class="admin-form">
                    <input type="text" id="taskDesc" placeholder="توضیح تسک (مثلاً: ۲۰ کلمه آموزش ببین)" />
                    <input type="number" id="taskTarget" placeholder="تعداد هدف (مثلاً: ۲۰)" />
                    <button class="btn btn-gold" onclick="addTask()">➕ افزودن تسک</button>
                </div>

                <hr style="margin:20px 0;border:1px solid rgba(255,255,255,0.05);" />

                <h3 style="margin-bottom:15px;color:rgba(255,255,255,0.7);">📝 افزودن درس گرامر</h3>
                <div class="admin-form">
                    <input type="text" id="grammarTitle" placeholder="عنوان درس (مثلاً: زمان حال ساده)" />
                    <textarea id="grammarContent" placeholder="متن درس گرامر..." style="min-height:100px;"></textarea>
                    <button class="btn btn-primary" onclick="addGrammar()">➕ افزودن درس</button>
                </div>
            </div>
        </div>

        <!-- ========================================================= -->
        <!-- PAGE: GAME (بازی) -->
        <!-- ========================================================= -->
        <div id="page-game" class="page">
            <div class="game-word" id="gameWord">Apple</div>
            <div class="game-options" id="gameOptions">
                <button class="game-option" data-index="0">سیب</button>
                <button class="game-option" data-index="1">پرتقال</button>
                <button class="game-option" data-index="2">موز</button>
                <button class="game-option" data-index="3">انگور</button>
            </div>
            <div class="game-progress">
                <span id="gameCounter">1 / 10</span>
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill" style="width:10%"></div>
                </div>
                <span id="gameScore">امتیاز: 0</span>
            </div>
            <button class="btn btn-success" style="width:100%;margin-top:15px;" onclick="nextGameQuestion()">سوال بعدی ➜</button>
        </div>

        <!-- ========================================================= -->
        <!-- PAGE: STUDY (آموزش) -->
        <!-- ========================================================= -->
        <div id="page-study" class="page">
            <div class="task-container" id="taskContainer">
                <h4 style="color:rgba(255,255,255,0.7);">📋 تسک روزانه</h4>
                <p id="taskDescDisplay" style="color:rgba(255,255,255,0.4);">هیچ تسکی تنظیم نشده</p>
                <div class="task-progress">
                    <span id="taskProgressText" style="color:rgba(255,255,255,0.3);">0%</span>
                    <div class="task-bar">
                        <div class="task-fill" id="taskFill" style="width:0%"></div>
                    </div>
                    <span id="taskStatus" style="font-weight:bold;color:rgba(255,255,255,0.3);">⏳</span>
                </div>
            </div>

            <div class="study-card" id="studyCard">
                <div class="word" id="studyWord">Apple</div>
                <div class="meaning" id="studyMeaning">سیب</div>
                <div class="sentence" id="studySentence">I eat an apple every day.</div>
            </div>
            <div class="study-nav">
                <button onclick="prevStudy()">◀ قبلی</button>
                <button class="btn-reveal" onclick="toggleMeaning()">👁 معنی</button>
                <button onclick="nextStudy()">بعدی ▶</button>
            </div>
            <p style="text-align:center;margin-top:10px;color:rgba(255,255,255,0.2);font-size:14px;">
                <span id="studyCounter">1</span> از <span id="studyTotal">0</span>
            </p>
        </div>

        <!-- ========================================================= -->
        <!-- PAGE: GRAMMAR (گرامر) -->
        <!-- ========================================================= -->
        <div id="page-grammar" class="page">
            <h3 style="margin-bottom:15px;color:rgba(255,255,255,0.7);">📝 درس‌های گرامر</h3>
            <div id="grammarList"></div>
        </div>

        <!-- ========================================================= -->
        <!-- PAGE: RANK (آمار) -->
        <!-- ========================================================= -->
        <div id="page-rank" class="page">
            <h3 style="margin-bottom:15px;color:rgba(255,255,255,0.7);">🏆 رتبه‌بندی کاربران</h3>
            <div class="rank-list" id="rankList"></div>
        </div>
    </div>

  <style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Vazir', 'Segoe UI', Tahoma, sans-serif;
    }

    body {
        background: linear-gradient(135deg, #0c0e1a 0%, #1a1c2e 50%, #0c0e1a 100%);
        min-height: 100vh;
        padding: 20px;
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
        overflow-x: hidden;
    }

    body::before {
        content: '';
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-image: 
            radial-gradient(2px 2px at 20px 30px, #eee, transparent),
            radial-gradient(2px 2px at 40px 70px, rgba(255,255,255,0.8), transparent),
            radial-gradient(2px 2px at 50px 160px, #ddd, transparent),
            radial-gradient(2px 2px at 90px 40px, rgba(255,255,255,0.6), transparent),
            radial-gradient(2px 2px at 130px 80px, #fff, transparent),
            radial-gradient(2px 2px at 160px 30px, rgba(255,255,255,0.7), transparent);
        background-size: 200px 200px;
        background-repeat: repeat;
        opacity: 0.3;
        pointer-events: none;
        z-index: 0;
    }

    .container {
        max-width: 520px;
        width: 100%;
        background: linear-gradient(145deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02));
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border-radius: 40px;
        padding: 25px;
        box-shadow: 
            0 30px 80px rgba(0, 0, 0, 0.6),
            inset 0 1px 0 rgba(255,255,255,0.1);
        position: relative;
        overflow: hidden;
        border: 1px solid rgba(255,255,255,0.05);
        z-index: 1;
    }

    .container::before {
        content: '';
        position: absolute;
        top: -50%;
        left: -50%;
        width: 200%;
        height: 200%;
        background: radial-gradient(ellipse at 30% 20%, rgba(108, 92, 231, 0.05), transparent 70%);
        pointer-events: none;
        animation: glowPulse 8s ease-in-out infinite;
    }

    @keyframes glowPulse {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 0.6; transform: scale(1.1); }
    }

    /* ===== HEADER ===== */
    .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
        padding-bottom: 15px;
        border-bottom: 1px solid rgba(255,255,255,0.05);
        flex-wrap: wrap;
        gap: 10px;
        position: relative;
        z-index: 2;
    }

    .header-left {
        display: flex;
        align-items: center;
        gap: 12px;
        flex: 1;
    }

    .title-section h1 {
        font-size: 22px;
        color: #ffd700;
        text-shadow: 
            0 0 30px rgba(255,215,0,0.15),
            0 0 60px rgba(255,215,0,0.05);
        letter-spacing: 2px;
        font-weight: 800;
        background: linear-gradient(135deg, #ffd700, #ff6b00);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        text-shadow: none;
    }

    .title-section .subtitle {
        font-size: 10px;
        color: rgba(255,255,255,0.3);
        letter-spacing: 4px;
        font-weight: 300;
        margin-top: 2px;
    }

    .header-right {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-shrink: 0;
    }

    .score-badge {
        background: linear-gradient(135deg, rgba(0, 184, 148, 0.2), rgba(0, 206, 201, 0.2));
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        color: #00cec9;
        padding: 6px 14px;
        border-radius: 50px;
        font-weight: bold;
        font-size: 14px;
        border: 1px solid rgba(0, 206, 201, 0.15);
        box-shadow: 0 4px 20px rgba(0, 206, 201, 0.05);
    }

    .streak-box {
        background: linear-gradient(135deg, rgba(255, 107, 107, 0.15), rgba(238, 90, 36, 0.15));
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        padding: 4px 12px 4px 8px;
        border-radius: 50px;
        display: flex;
        align-items: center;
        gap: 4px;
        color: #ff6b6b;
        font-weight: bold;
        font-size: 14px;
        border: 1px solid rgba(255, 107, 107, 0.1);
        box-shadow: 0 4px 20px rgba(255, 107, 107, 0.05);
        animation: firePulse 2s ease-in-out infinite;
    }

    @keyframes firePulse {
        0%, 100% { box-shadow: 0 4px 20px rgba(255, 107, 107, 0.05); }
        50% { box-shadow: 0 4px 30px rgba(255, 107, 107, 0.15); }
    }

    .streak-box .fire-icon {
        font-size: 18px;
        display: inline-block;
        animation: fireDance 1.5s ease-in-out infinite;
    }

    @keyframes fireDance {
        0%, 100% { transform: rotate(-5deg) scale(1); }
        50% { transform: rotate(5deg) scale(1.1); }
    }

    .streak-box .streak-number {
        font-size: 18px;
        min-width: 20px;
        text-align: center;
        transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* ===== تب‌ها ===== */
    .tabs {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 6px;
        margin-bottom: 20px;
        position: relative;
        z-index: 2;
    }

    .tab-btn {
        padding: 10px 4px;
        border: none;
        border-radius: 16px;
        background: rgba(255,255,255,0.03);
        color: rgba(255,255,255,0.4);
        font-weight: bold;
        font-size: 11px;
        cursor: pointer;
        transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        border: 1px solid rgba(255,255,255,0.03);
        letter-spacing: 0.5px;
    }

    .tab-btn:hover {
        transform: translateY(-2px);
        background: rgba(255,255,255,0.05);
        color: rgba(255,255,255,0.6);
    }

    .tab-btn.active {
        background: linear-gradient(135deg, rgba(108, 92, 231, 0.2), rgba(9, 132, 227, 0.2));
        color: #a29bfe;
        border-color: rgba(108, 92, 231, 0.15);
        box-shadow: 0 4px 20px rgba(108, 92, 231, 0.05);
    }

    /* ===== صفحات ===== */
    .page {
        display: none;
        animation: fadeIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .page.active {
        display: block;
    }

    @keyframes fadeIn {
        from {
            opacity: 0;
            transform: translateY(20px) scale(0.98);
        }
        to {
            opacity: 1;
            transform: translateY(0) scale(1);
        }
    }

    /* ===== فرم‌ها ===== */
    .admin-form {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-bottom: 20px;
    }

    .admin-form input,
    .admin-form textarea {
        padding: 14px 18px;
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 16px;
        font-size: 14px;
        transition: all 0.3s ease;
        background: rgba(255,255,255,0.03);
        color: rgba(255,255,255,0.8);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
    }

    .admin-form input::placeholder,
    .admin-form textarea::placeholder {
        color: rgba(255,255,255,0.2);
    }

    .admin-form input:focus,
    .admin-form textarea:focus {
        border-color: rgba(108, 92, 231, 0.2);
        outline: none;
        box-shadow: 0 0 0 4px rgba(108, 92, 231, 0.05);
        background: rgba(255,255,255,0.05);
    }

    .admin-form textarea {
        min-height: 60px;
        resize: vertical;
    }

    .btn {
        padding: 14px;
        border: none;
        border-radius: 16px;
        font-weight: bold;
        font-size: 15px;
        cursor: pointer;
        transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        color: white;
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
    }

    .btn-primary {
        background: linear-gradient(135deg, rgba(108, 92, 231, 0.3), rgba(9, 132, 227, 0.3));
        border: 1px solid rgba(108, 92, 231, 0.1);
        color: #a29bfe;
    }

    .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 30px rgba(108, 92, 231, 0.1);
    }

    .btn-success {
        background: linear-gradient(135deg, rgba(0, 184, 148, 0.3), rgba(0, 206, 201, 0.3));
        border: 1px solid rgba(0, 206, 201, 0.1);
        color: #00cec9;
    }

    .btn-success:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 30px rgba(0, 206, 201, 0.1);
    }

    .btn-gold {
        background: linear-gradient(135deg, rgba(253, 203, 110, 0.2), rgba(243, 156, 18, 0.2));
        border: 1px solid rgba(253, 203, 110, 0.1);
        color: #fdcb6e;
    }

    .btn-gold:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 30px rgba(253, 203, 110, 0.1);
    }

    /* ===== لیست کلمات ===== */
    .word-list {
        max-height: 300px;
        overflow-y: auto;
        margin-top: 15px;
    }

    .word-list::-webkit-scrollbar {
        width: 4px;
    }

    .word-list::-webkit-scrollbar-track {
        background: rgba(255,255,255,0.02);
        border-radius: 10px;
    }

    .word-list::-webkit-scrollbar-thumb {
        background: rgba(108, 92, 231, 0.2);
        border-radius: 10px;
    }

    .word-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px 16px;
        background: rgba(255,255,255,0.03);
        border-radius: 14px;
        margin-bottom: 8px;
        border-right: 3px solid rgba(108, 92, 231, 0.2);
        animation: slideIn 0.3s ease;
        transition: all 0.3s ease;
    }

    .word-item:hover {
        background: rgba(255,255,255,0.05);
    }

    @keyframes slideIn {
        from {
            opacity: 0;
            transform: translateX(-20px);
        }
        to {
            opacity: 1;
            transform: translateX(0);
        }
    }

    .word-item .word-en {
        font-weight: bold;
        color: rgba(255,255,255,0.9);
        font-size: 15px;
    }

    .word-item .word-fa {
        color: rgba(255,255,255,0.5);
        font-size: 13px;
    }

    .word-item .word-actions {
        display: flex;
        gap: 6px;
    }

    .word-item .word-actions button {
        padding: 4px 10px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-size: 11px;
        font-weight: bold;
        transition: all 0.3s ease;
    }

    .btn-edit {
        background: rgba(253, 203, 110, 0.15);
        color: #fdcb6e;
    }

    .btn-edit:hover {
        background: rgba(253, 203, 110, 0.25);
    }

    .btn-delete {
        background: rgba(225, 112, 85, 0.15);
        color: #e17055;
    }

    .btn-delete:hover {
        background: rgba(225, 112, 85, 0.25);
    }

    /* ===== لاگین ===== */
    .login-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(12, 14, 26, 0.9);
        backdrop-filter: blur(30px);
        -webkit-backdrop-filter: blur(30px);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 1000;
    }

    .login-box {
        background: rgba(255,255,255,0.03);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        padding: 40px;
        border-radius: 30px;
        max-width: 400px;
        width: 90%;
        text-align: center;
        animation: popIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        border: 1px solid rgba(255,255,255,0.05);
    }

    .login-box h2 {
        margin-bottom: 15px;
        color: rgba(255,255,255,0.8);
        font-weight: 300;
        letter-spacing: 1px;
    }

    .login-box p {
        color: rgba(255,255,255,0.3);
        font-size: 14px;
    }

    .login-box input {
        width: 100%;
        padding: 14px;
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 16px;
        font-size: 15px;
        margin-bottom: 15px;
        transition: all 0.3s ease;
        background: rgba(255,255,255,0.02);
        color: rgba(255,255,255,0.7);
    }

    .login-box input:focus {
        border-color: rgba(108, 92, 231, 0.15);
        outline: none;
        box-shadow: 0 0 0 4px rgba(108, 92, 231, 0.03);
        background: rgba(255,255,255,0.04);
    }

    .login-box input::placeholder {
        color: rgba(255,255,255,0.15);
    }

    .login-box .btn {
        width: 100%;
    }

    /* ===== اسکرول ===== */
    ::-webkit-scrollbar {
        width: 4px;
    }

    ::-webkit-scrollbar-track {
        background: rgba(255,255,255,0.01);
        border-radius: 10px;
    }

    ::-webkit-scrollbar-thumb {
        background: rgba(108, 92, 231, 0.15);
        border-radius: 10px;
    }

    /* ===== ریسپانسیو ===== */
    @media (max-width: 480px) {
        .container {
            padding: 15px;
            border-radius: 28px;
        }

        .tabs {
            grid-template-columns: repeat(5, 1fr);
            gap: 4px;
        }

        .tab-btn {
            font-size: 9px;
            padding: 8px 2px;
            border-radius: 12px;
        }

        .header {
            flex-direction: column;
            align-items: stretch;
            gap: 8px;
        }

        .header-left {
            justify-content: space-between;
        }

        .header-right {
            justify-content: space-between;
        }

        .title-section h1 {
            font-size: 17px;
        }

        .title-section .subtitle {
            font-size: 8px;
        }

        .score-badge {
            font-size: 12px;
            padding: 4px 12px;
        }

        .streak-box {
            font-size: 12px;
            padding: 4px 10px 4px 6px;
        }

        .streak-box .fire-icon {
            font-size: 14px;
        }

        .streak-box .streak-number {
            font-size: 14px;
        }

        .login-box {
